[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-study"
version = "0.1.0"
description = "Zero Study: quizzes, calendar, class periods, GPA calculator, and a high school/college planner."
requires-python = ">=3.9"
dependencies = [
    "pdfplumber",
    "pytesseract",
    "Pillow",
]

[project.scripts]
zero-study = "study_buddy.cli:main"
zero-study-gui = "study_buddy.gui:main"

[tool.setuptools]
packages = ["study_buddy"]

[tool.setuptools.package-data]
study_buddy = ["icon.icns"]
